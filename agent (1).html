<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Buyer Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f13; --bg2: #17171d; --bg3: #1e1e26; --bg4: #25252f;
  --text: #e8eaf2; --text2: #8890aa; --text3: #555d75;
  --border: #2a2a38; --border2: #333344;
  --accent: #4361ee; --accent2: #3451d1;
  --green: #22c55e; --green-bg: #052e16; --green-text: #86efac;
  --red: #ef4444; --red-bg: #2d0a0a; --red-text: #fca5a5;
  --amber: #f59e0b; --amber-bg: #2d1a00; --amber-text: #fcd34d;
  --gray-bg: #1a1a22; --gray-text: #8890aa;
  --blue-bg: #0a1628; --blue-text: #93c5fd;
  --radius: 10px; --radius-sm: 6px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* TOP BAR */
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bg2); border-bottom: 0.5px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.topbar-title { font-size: 14px; font-weight: 600; color: var(--text); margin-right: 8px; white-space: nowrap; }
.topbar input { padding: 6px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg3); color: var(--text); font-size: 12px; outline: none; font-family: 'SF Mono', monospace; }
.topbar input:focus { border-color: var(--accent); }
.topbar input.wide { width: 260px; }
.topbar input.mid { width: 180px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.status-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-dot.err { background: var(--red); }
.tb-btn { padding: 6px 12px; font-size: 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.tb-btn:hover { background: var(--bg3); color: var(--text); }
.tb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb-btn.primary:hover { background: var(--accent2); }
.tb-sep { width: 0.5px; height: 20px; background: var(--border); flex-shrink: 0; }
.tb-label { font-size: 11px; color: var(--text3); white-space: nowrap; }

/* MAIN LAYOUT */
.main { display: flex; flex: 1; overflow: hidden; }

/* LEFT PANEL — STATS */
.left-panel { width: 300px; flex-shrink: 0; background: var(--bg2); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 12px 14px; border-bottom: 0.5px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.panel-header span { color: var(--text2); font-weight: 400; font-size: 11px; text-transform: none; letter-spacing: 0; }
.upload-drop { margin: 12px; border: 1px dashed var(--border2); border-radius: var(--radius); padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.15s; }
.upload-drop:hover { border-color: var(--accent); background: var(--bg3); }
.upload-drop p { font-size: 12px; color: var(--text3); margin-top: 4px; }
.upload-drop h4 { font-size: 13px; color: var(--text2); }

.stats-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.stat-card { background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
.stat-card .label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.stat-card .value { font-size: 20px; font-weight: 600; }
.stat-card .value.green { color: var(--green); }
.stat-card .value.red   { color: var(--red); }
.stat-card .value.amber { color: var(--amber); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.stat-mini { background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
.stat-mini .label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
.stat-mini .value { font-size: 15px; font-weight: 600; }

.ads-list { margin-top: 4px; }
.ad-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-sm); margin-bottom: 2px; background: var(--bg4); border: 0.5px solid var(--border); }
.ad-row .ad-id { font-size: 10px; font-family: 'SF Mono', monospace; color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.ad-dot.kill  { background: var(--red); }
.ad-dot.keep  { background: var(--green); }
.ad-dot.watch { background: var(--amber); }
.ad-dot.off   { background: var(--text3); }
.ad-epc { font-size: 10px; color: var(--text3); white-space: nowrap; }
.section-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; }

/* RIGHT PANEL — CHAT */
.right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }
.msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; max-width: 75%; }
.msg.user .msg-bubble { background: var(--accent); color: #fff; border-radius: 14px 14px 4px 14px; }
.msg.agent .msg-bubble { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px 14px 14px 4px; color: var(--text); }
.msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
.msg.user  .msg-avatar { background: var(--accent2); }
.msg.agent .msg-avatar { background: var(--bg3); border: 0.5px solid var(--border); }

.action-log { background: var(--bg3); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12px; color: var(--text2); font-family: 'SF Mono', monospace; margin-top: 4px; line-height: 1.6; }
.action-log .ok   { color: var(--green-text); }
.action-log .err  { color: var(--red-text); }
.action-log .info { color: var(--blue-text); }

.typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

.chat-input-area { padding: 12px 16px; background: var(--bg2); border-top: 0.5px solid var(--border); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
.chat-input-area textarea { flex: 1; padding: 10px 14px; border: 0.5px solid var(--border2); border-radius: 20px; background: var(--bg3); color: var(--text); font-size: 14px; resize: none; outline: none; min-height: 42px; max-height: 120px; line-height: 1.5; font-family: inherit; transition: border-color 0.15s; }
.chat-input-area textarea:focus { border-color: var(--accent); }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background 0.15s; flex-shrink: 0; }
.send-btn:hover { background: var(--accent2); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.welcome { text-align: center; padding: 40px 20px; color: var(--text2); }
.welcome h2 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.welcome p { font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
.examples { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.example-btn { padding: 8px 16px; border: 0.5px solid var(--border2); border-radius: 20px; background: var(--bg2); color: var(--text2); font-size: 13px; cursor: pointer; transition: all 0.15s; text-align: left; max-width: 400px; width: 100%; }
.example-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--accent); }

.badge-sm { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-sm.kill  { background: var(--red-bg);   color: var(--red-text); }
.badge-sm.keep  { background: var(--green-bg); color: var(--green-text); }
.badge-sm.watch { background: var(--amber-bg); color: var(--amber-text); }
.badge-sm.off   { background: var(--gray-bg);  color: var(--gray-text); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">⚡ Media Buyer Agent</div>
  <div class="tb-sep"></div>
  <div class="tb-label">Anthropic API</div>
  <input class="wide" type="password" id="claudeKey" placeholder="sk-ant-..." oninput="onKeyChange()">
  <div class="status-dot" id="claudeDot"></div>
  <div class="tb-sep"></div>
  <div class="tb-label">FB Token</div>
  <input class="mid" type="password" id="fbToken" placeholder="EAAxx..." oninput="onFbChange()">
  <button class="tb-btn" onclick="checkFb()">Проверить</button>
  <div class="status-dot" id="fbDot"></div>
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="document.getElementById('csvInput').click()">📂 CSV</button>
  <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="loadCsv(this)">
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT -->
  <div class="left-panel">
    <div class="panel-header">Статистика <span id="csvName">нет данных</span></div>
    <div class="stats-scroll" id="statsPanel">
      <div style="padding:24px 12px; text-align:center; color:var(--text3); font-size:13px;">
        Загрузи CSV из Кейтаро чтобы агент видел твои данные
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcome">
        <h2>Привет 👋</h2>
        <p>Я твой медиабайер агент. Загрузи CSV из Кейтаро и вставь токены — я смогу анализировать твою статистику и управлять объявлениями через FB API.</p>
        <div class="examples">
          <button class="example-btn" onclick="sendExample(this.textContent)">выключи все объявления с EPC ниже 1</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">покажи топ 5 объявлений по ROI</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">сколько сегодня потрачено суммарно</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">выключи всё кроме тех где есть конверсии</button>
          <button class="example-btn" onclick="sendExample(this.textContent)">какие объявления стоит оставить на ночь</button>
        </div>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea id="chatInput" placeholder="Напиши команду агенту..." rows="1" onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
  </div>

</div>

<script>
let csvData = [];
let chatHistory = [];
let fbValid = false;

// ─── TOKEN CHECKS ───────────────────────────────────────────────────────────
function onKeyChange() {
  const dot = document.getElementById('claudeDot');
  dot.className = 'status-dot';
  const v = document.getElementById('claudeKey').value.trim();
  if (v.startsWith('sk-ant-')) { dot.className = 'status-dot ok'; }
}

function onFbChange() {
  fbValid = false;
  document.getElementById('fbDot').className = 'status-dot';
}

async function checkFb() {
  const token = document.getElementById('fbToken').value.trim();
  if (!token) return;
  const dot = document.getElementById('fbDot');
  dot.className = 'status-dot';
  try {
    const r = await fetch(`https://graph.facebook.com/v19.0/me?fields=id,name&access_token=${token}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    fbValid = true;
    dot.className = 'status-dot ok';
    appendMsg('agent', `✅ FB токен валиден — аккаунт: **${d.name || d.id}**`);
  } catch(e) {
    dot.className = 'status-dot err';
    appendMsg('agent', `❌ Ошибка FB токена: ${e.message}`);
  }
}

// ─── CSV LOAD ────────────────────────────────────────────────────────────────
function loadCsv(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('csvName').textContent = file.name;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: res => {
      csvData = res.data;
      renderStats();
      appendMsg('agent', `📊 Загружено **${csvData.length}** объявлений из ${file.name}. Можешь задавать вопросы или давать команды.`);
    }
  });
}

function getVal(row, keys) {
  for (const k of keys) {
    const found = Object.keys(row).find(rk => rk.trim().toLowerCase().includes(k.toLowerCase()));
    if (found && row[found] !== undefined && row[found] !== '') {
      const v = parseFloat(String(row[found]).replace(',','.').replace('%','').replace('$','').trim());
      if (!isNaN(v)) return v;
    }
  }
  return null;
}

function getAdId(row) {
  const found = Object.keys(row).find(k => k.trim().toLowerCase().includes('sub id 4') || k.trim() === 'Sub ID 4');
  return found ? String(row[found]).trim() : null;
}

function parseRows() {
  return csvData.map(row => ({
    id:     getAdId(row),
    spend:  getVal(row, ['расход','spend','cost']),
    cpc:    getVal(row, ['cpc','срс']),
    lpctr:  getVal(row, ['lp ctr','lp ктр','кликабельност']),
    lpcpc:  getVal(row, ['cpc offer','lp cpc','offer cpc']),
    epc:    getVal(row, ['epc (все)','epc все','epc (all)','epc']),
    conv:   getVal(row, ['конв','conv','leads','sales']),
    roi:    getVal(row, ['roi']),
    revenue:getVal(row, ['доход','revenue','income'])
  }));
}

function renderStats() {
  const ads = parseRows();
  const totalSpend   = ads.reduce((s,r) => s + (r.spend||0), 0);
  const totalRev     = ads.reduce((s,r) => s + (r.revenue||0), 0);
  const totalConv    = ads.reduce((s,r) => s + (r.conv||0), 0);
  const profit       = totalRev - totalSpend;
  const roi          = totalSpend > 0 ? ((profit/totalSpend)*100) : 0;
  const withConv     = ads.filter(r => r.conv && r.conv > 0).length;
  const avgEpc       = ads.filter(r=>r.epc).reduce((s,r,_,a)=>s+r.epc/a.length,0);

  const roiColor = roi > 0 ? 'green' : roi < 0 ? 'red' : 'amber';

  document.getElementById('statsPanel').innerHTML = `
    <div class="stat-card" style="margin-top:12px">
      <div class="label">ROI</div>
      <div class="value ${roiColor}">${roi.toFixed(1)}%</div>
    </div>
    <div class="stat-grid">
      <div class="stat-mini"><div class="label">Расход</div><div class="value">$${totalSpend.toFixed(0)}</div></div>
      <div class="stat-mini"><div class="label">Доход</div><div class="value">$${totalRev.toFixed(0)}</div></div>
      <div class="stat-mini"><div class="label">Профит</div><div class="value ${profit>=0?'green':'red'}">$${profit.toFixed(0)}</div></div>
      <div class="stat-mini"><div class="label">Конверсии</div><div class="value">${totalConv}</div></div>
      <div class="stat-mini"><div class="label">EPC avg</div><div class="value">$${avgEpc.toFixed(2)}</div></div>
      <div class="stat-mini"><div class="label">С конв.</div><div class="value green">${withConv}</div></div>
    </div>
    <div class="section-title">Объявления (${ads.length})</div>
    <div class="ads-list">
      ${ads.slice(0,30).map(r => {
        const status = r.conv>0 ? 'keep' : r.epc>1 ? 'keep' : r.epc<0.5 ? 'kill' : 'watch';
        return `<div class="ad-row">
          <div class="ad-dot ${status}"></div>
          <div class="ad-id">${r.id || '—'}</div>
          <div class="ad-epc">${r.epc!=null?'$'+r.epc.toFixed(2):'—'}</div>
        </div>`;
      }).join('')}
      ${ads.length > 30 ? `<div style="font-size:11px;color:var(--text3);text-align:center;padding:8px">и ещё ${ads.length-30}...</div>` : ''}
    </div>
  `;
}

// ─── FB API ──────────────────────────────────────────────────────────────────
async function fbSetStatus(adId, enable) {
  const token = document.getElementById('fbToken').value.trim();
  if (!token) return { ok: false, error: 'нет токена' };
  try {
    const r = await fetch(`https://graph.facebook.com/v19.0/${adId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: enable ? 'ACTIVE' : 'PAUSED', access_token: token })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    return { ok: true };
  } catch(e) { return { ok: false, error: e.message }; }
}

// ─── CLAUDE API ──────────────────────────────────────────────────────────────
function buildSystemPrompt() {
  const ads = parseRows();
  const hasFb = !!document.getElementById('fbToken').value.trim();
  const statsText = ads.length > 0 ? `
Текущая статистика (${ads.length} объявлений):
${ads.map(r => `ID:${r.id} spend:$${r.spend||0} epc:$${r.epc||0} conv:${r.conv||0} roi:${r.roi||0}% lpctr:${r.lpctr||0}% cpc:$${r.cpc||0} lpcpc:$${r.lpcpc||0}`).join('\n')}
` : 'CSV не загружен.';

  return `Ты медиабайер агент для арбитража трафика. Помогаешь управлять рекламными кампаниями в Facebook.

${statsText}

FB API: ${hasFb ? 'доступен' : 'токен не введён'}.

Когда нужно выполнить действие в Facebook (выключить/включить объявления) — верни JSON в конце сообщения в блоке \`\`\`actions:
[{"action":"pause","id":"AD_ID"},{"action":"enable","id":"AD_ID"}]
\`\`\`

Правила:
- Объявления с конверсиями (conv > 0) НИКОГДА не выключай без явного разрешения пользователя
- Отвечай на русском, кратко и по делу
- Если данных нет — скажи что нужно загрузить CSV
- Форматируй числа красиво ($123, 45%)
- Когда выполняешь действия — перечисляй что именно делаешь`;
}

async function callClaude(userMessage) {
  const key = document.getElementById('claudeKey').value.trim();
  if (!key) throw new Error('Вставь Anthropic API ключ');

  chatHistory.push({ role: 'user', content: userMessage });

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: buildSystemPrompt(),
      messages: chatHistory
    })
  });

  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  const text = d.content.map(c => c.text || '').join('');
  chatHistory.push({ role: 'assistant', content: text });
  return text;
}

// ─── ACTIONS PARSER ──────────────────────────────────────────────────────────
async function executeActions(text) {
  const match = text.match(/```actions\n([\s\S]*?)\n```/);
  if (!match) return null;
  let actions;
  try { actions = JSON.parse(match[1]); } catch(e) { return null; }
  if (!actions || !actions.length) return null;

  const token = document.getElementById('fbToken').value.trim();
  if (!token) return `⚠️ FB токен не введён — действия не выполнены`;

  const results = [];
  for (const a of actions) {
    const enable = a.action === 'enable';
    const res = await fbSetStatus(a.id, enable);
    results.push(`${res.ok ? '✅' : '❌'} ${enable ? 'Включено' : 'Выключено'}: ${a.id}${res.error ? ' — ' + res.error : ''}`);
  }
  return results.join('\n');
}

// ─── CHAT UI ─────────────────────────────────────────────────────────────────
function appendMsg(role, text) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = role === 'user' ? '👤' : '⚡';
  const cleanText = text.replace(/```actions[\s\S]*?```/g, '').trim();
  const html = cleanText
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-bubble">${html}</div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function appendActionLog(logText) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.padding = '0 38px';
  div.innerHTML = `<div class="action-log">${logText.replace(/✅/g,'<span class="ok">✅</span>').replace(/❌/g,'<span class="err">❌</span>').replace(/\n/g,'<br>')}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="msg-avatar">⚡</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', text);
  showTyping();

  try {
    const response = await callClaude(text);
    removeTyping();
    appendMsg('agent', response);

    const actionLog = await executeActions(response);
    if (actionLog) {
      appendActionLog(actionLog);
      if (csvData.length > 0) renderStats();
    }
  } catch(e) {
    removeTyping();
    appendMsg('agent', `❌ Ошибка: ${e.message}`);
  }

  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function sendExample(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
